name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node for DOM script regressions
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore src/Luma/Luma.csproj -p:Platform=x64 --locked-mode

      - name: Restore behavioral tests
        run: dotnet restore tests/Luma.Tests/Luma.Tests.csproj -p:Platform=x64 --locked-mode

      - name: Build
        run: dotnet build src/Luma/Luma.csproj -c Release -p:Platform=x64 --no-restore

      - name: Behavioral and Windows vault tests
        env:
          LUMA_VAULT_TEST_SCRIPT_DIRECTORY: ${{ runner.temp }}/luma-dom-tests
        run: |
          New-Item -ItemType Directory -Force $env:LUMA_VAULT_TEST_SCRIPT_DIRECTORY | Out-Null
          dotnet build tests/Luma.Tests/Luma.Tests.csproj -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/Luma.Tests/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/Luma.Tests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/VaultAutofillTests.js $env:LUMA_VAULT_TEST_SCRIPT_DIRECTORY

      - name: Watch DOM script regressions
        run: node tests/ForegroundWatchTests.js
